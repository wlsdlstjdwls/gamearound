<script id="env:sample-1" type="application/json">{"cache":{"Product:JP0106-PPSA25406_00-APP052554D424C45":{"id":"JP0106-PPSA25406_00-APP052554D424C45","__typename":"Product","name":"진격의거인３ (중국어(간체자), 한국어, 영어, 일본어, 중국어(번체자))","descriptions":[{"__typename":"Description","type":"SHORT","value":"시작하자, 이별을 위해."},{"__typename":"Description","type":"LONG","value":"[예약 특전]<br/>・주인공 의상 「캐릭터 편집 부품: 자유의 날개 피어스」<br/>게임 내에서 사용할 수 있는 캐릭터 편집 부품입니다.<br/>※ 특전은 추후 유료 또는 무료로 배포될 수 있습니다. 미리 양해 부탁드립니다.<br/><br/><br/>[조기 구매 특전]<br/>・주인공 의상 「캐릭터 편집 부품: 자유의 날개 후드티」<br/>게임 내에서 사용할 수 있는 캐릭터 편집 부품입니다.<br/>※특전은 추후 유료 또는 무료로 배포될 수 있습니다. 미리 양해 부탁드립니다.<br/>※2026년 12월 23일까지 조기 구입 특전으로 입수 가능합니다.<br/><br/><br/>시작하자, 이별을 위해.<br/><br/>■『진격의 거인』의 이야기를 처음부터 끝까지 그려낸 작품<br/>이야기를 처음부터 끝까지 체험할 수 있는, 게임 「진격의 거인」 시리즈의 집대성입니다. 본 작에서 처음 등장하는 아홉 거인과의 손에 땀을 쥐는 대결과 새로운 이야기는 물론, 이전 작품에서 등장한 장면들도 새로운 체험으로 재구성했습니다. 이야기의 클라이맥스까 그려냅니다.<br/><br/>■ 공중을 자유자재로 누비며 거인을 토벌하는 \"입체 기동 액션\"<br/>입체 기동 액션이 공중을 더욱 자유롭게 누빌 수 있도록 진화했습니다. 거인들의 행동도 한층 다양해져, 새로운 위협으로 플레이어 앞에 나타납니다. 두 가지 진화로, 다양한 거인의 움직임에 맞춰 임기응변으로 액션을 구사하며 거인을 토벌하는 뜨거운 전투를 펼칠 수 있습니다. 또한 간단 조작을 설정할 수 있어, 액션 게임이 서투른 유저도 숙련된 조사병처럼 화려한 액션을 즐기실 수 있습니다.<br/><br/>■ 나만의 분대를 편성해 도전하는 목숨을 건 ‘벽외 특무’<br/>신 요소로서 ‘벽외 특무’가 등장합니다. 다양한 능력과 스킬을 지닌 조사병을 영입해 자신만의 분대를 편성합니다. 위험이 도사리는 광대한 벽 밖 세계에서 분대원들과 함께 목숨을 건 임무에 도전하게 됩니다. 밀려드는 거인의 위협 속에서 전진할지 후퇴할지, 그 결정은 플레이어에게 맡겨집니다.<br/><br/>※『진격의거인３ Digital Deluxe Edition』도 있습니다. 구매 시 원하시는 내용을 선택하신 후 결제하시기 바랍니다.<br/>※자세한 내용은 공식 홈페이지를 확인해 주십시오.<br/><br/>※이미지는 개발 중인 화면으로, 실제 내용과 다를 수 있습니다.<br/>"}]},"Concept:10012189":{"id":"10012189","__typename":"Concept","name":"진격의거인３","defaultProduct":{"__ref":"Product:JP0106-PPSA25406_00-APP052554D424C45"},"descriptions":[{"__typename":"Description","type":"LONG","value":"모든 적을 구축하라!<br/><br/>이야기의 시작부터 끝까지 모두 체험 가능한 게임 「진격의 거인」 시리즈의 집대성입니다.<br/><br/>본작에 최초로 등장하는 아홉 거인과의 손에 땀이 <br/>이번 작품에서 처음 등장하는 아홉 거인과의 손에 땀을 쥐게 하는 대결과 새로운 이야기뿐만 아니라, 이전 작품에서 등장했던 장면들도 새로운 경험으로 재구성되었습니다. 이야기의 클라이맥스까지 남김없이 그려냅니다. 입체기동 액션도 한층 더 진화했습니다. 시리즈 최고 수준의 상쾌하고 스타일리시한 액션을 즐겨보세요."}]}}}</script>
