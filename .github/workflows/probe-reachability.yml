# 실행 환경 진단 — 러너에서 어느 스토어가 열리는지 실측한다. 수동 실행 전용.
# 쓰는 때: 프록시(CRAWL_PROXY_URL)를 새로 붙였을 때, 또는 러너 차단 상태가 달라졌는지 확인할 때.
# 차단은 "고장"이 아니라 알아내려던 사실이라 이 워크플로는 늘 초록으로 끝난다 — 판단은 로그를 보고 한다.
name: probe-reachability

on:
  workflow_dispatch:
    inputs:
      use_proxy:
        description: "프록시를 거쳐 잴지 (CRAWL_PROXY_URL 시크릿이 있어야 함)"
        type: boolean
        required: false
        default: true

concurrency:
  group: probe-reachability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # false 로 실행하면 프록시 없이 잰다 — 프록시가 실제로 효과가 있는지 앞뒤를 비교할 수 있다
      CRAWL_PROXY_URL: ${{ github.event.inputs.use_proxy == 'false' && '' || secrets.CRAWL_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: probe
        run: pnpm probe
