# 설계서 §4.3 — crawl-meta. 소스 순차 실행, 한 소스가 실패해도 다음 소스 계속(continue-on-error).
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락(§4.4)으로 이중 방지.
name: crawl-meta

on:
  schedule:
    # 주기 2일: 실행 1회 ~10분 × 15회/월 ≈ 월 150분. 평점은 변동이 느려 일간 → 격일로 완화.
    - cron: "0 3 */2 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""

concurrency:
  group: crawl-meta
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  # 있으면 opencritic 소스가 자동 활성, 없으면 어댑터가 비활성 사유를 대시보드에 표시
  OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
  # 신규 시드된 게임이 hltb/평점 ref 를 받기까지 걸리는 시간을 줄인다(기본 50 → 150).
  # crawl-prices 가 하루 최대 수백 건을 새로 시드하므로 격일 50건으로는 매칭 대기열이 계속 밀린다.
  MATCH_ARG: --match=150

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: crawl hltb
        continue-on-error: true
        run: pnpm crawl --source=hltb $MATCH_ARG $CRAWL_LIMIT_ARG

      - name: crawl opencritic
        continue-on-error: true
        run: pnpm crawl --source=opencritic $MATCH_ARG $CRAWL_LIMIT_ARG

      - name: crawl metacritic
        continue-on-error: true
        run: pnpm crawl --source=metacritic $MATCH_ARG $CRAWL_LIMIT_ARG
