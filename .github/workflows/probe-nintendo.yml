# 일회성 조사 — 한국 eShop 이 Actions 러너에 빈 결과를 주는 이유를 본다. 확인 후 삭제한다.
name: probe-nintendo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 러너 IP 위치
        run: curl -s https://ipinfo.io/json | head -c 300; echo
      - name: 검색 결과 페이지
        run: |
          curl -s -o /tmp/search.html -w "search http=%{http_code} size=%{size_download}\n" \
            'https://store.nintendo.co.kr/catalogsearch/result/?q=%EB%A7%88%EB%A6%AC%EC%98%A4' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' \
            -H 'Accept-Language: ko-KR,ko;q=0.9'
          echo "product-item-link 개수: $(grep -c 'product-item-link' /tmp/search.html || true)"
          echo "--- title:"; grep -o '<title>[^<]*</title>' /tmp/search.html | head -2
          echo "--- 본문 일부:"; sed -e 's/<[^>]*>//g' /tmp/search.html | tr -s ' \n' ' \n' | grep -v '^\s*$' | head -20
      - name: 상품 페이지
        run: |
          curl -s -o /tmp/p.html -w "product http=%{http_code} size=%{size_download}\n" \
            'https://store.nintendo.co.kr/70010000024633' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' \
            -H 'Accept-Language: ko-KR,ko;q=0.9'
          echo "가격 노드: $(grep -c 'data-price-amount' /tmp/p.html || true)"
          grep -o '<title>[^<]*</title>' /tmp/p.html | head -2
