# 구독 카탈로그(gamepass) 수집.
#
# 2026-09-30 에 회사 정보(wikidata)도 여기서 뺐다 — 서울 리전 Vercel 크론(/api/cron/crawl/wikidata/collect)이
# 하루 2회 맡는다. 주 1회 150개 이름으로는 한 주에 새로 들어오는 게임의 회사 이름도 못 따라갔고,
# 09-28 월요일 회차처럼 Actions 결제가 막힌 날엔 한 주를 통째로 잃었다. 같은 이유로 둘을 같이 두지 않는다.
#
# 2026-09-17 에 검색 별칭(wikidata_game)을 여기서 뺐다 — 서울 리전 Vercel 크론으로 옮겼다
# (몫과 주기의 근거는 sync/constants 의 CRON_META_PLAN). 두 곳에서 같이 돌리면 Redis 락에 걸려
# 한쪽이 빈손이 된다. 되돌리고 싶어도 크론을 먼저 지우고 여기에 넣는다, 둘을 같이 두지 않는다.
# 옮긴 이유: 별칭 한 바퀴가 이 자리에서 240일이었다(본편이 4,907 에서 14,788 로 늘었다).
# 가격 워크플로와 분리한 이유(기획서 7.4): 둘 다 변동이 느리고 응답이 느리다.
# 가격 배치에 섞으면 하루 3회 도는 수집이 백과사전 응답 속도에 묶인다.
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락으로 이중 방지.
name: crawl-catalog

on:
  schedule:
    # 주기 2일. gamepass 는 요청이 2회뿐이다(카탈로그가 월 2회 안팎으로 바뀌어 격일로 충분하다).
    - cron: "30 4 */2 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""

concurrency:
  group: crawl-catalog
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 별칭 단계와 회사 수집을 크론으로 보낸 뒤 남은 것은 gamepass 2분이다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 구독 카탈로그 — 격일. 제목 매칭 개념이 없어 --no-match 로 매칭 단계를 건너뛴다
      - name: crawl gamepass
        continue-on-error: true
        run: pnpm crawl --source=gamepass --no-match $CRAWL_LIMIT_ARG

