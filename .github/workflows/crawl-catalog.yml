# 회사 정보(wikidata)와 구독 카탈로그(gamepass) 수집.
# 가격 워크플로와 분리한 이유(기획서 7.4): 둘 다 변동이 느리고 응답이 느리다.
# 가격 배치에 섞으면 하루 3회 도는 수집이 백과사전 응답 속도에 묶인다.
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락으로 이중 방지.
name: crawl-catalog

on:
  schedule:
    # gamepass 는 요청이 2회뿐이라 매일 돌려도 비용이 없다. 카탈로그는 월 2회 안팎으로 바뀐다.
    - cron: "30 4 * * *"
    # wikidata 는 주 1회. 설립일, 국가는 사실상 안 바뀌고 공개 SPARQL 에 예의를 지켜야 한다.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""

concurrency:
  group: crawl-catalog
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 구독 카탈로그 — 매일. 제목 매칭 개념이 없어 --no-match 로 매칭 단계를 건너뛴다
      - name: crawl gamepass
        continue-on-error: true
        run: pnpm crawl --source=gamepass --no-match $CRAWL_LIMIT_ARG

      # 회사 정보 — 월요일 실행분에서만. 다른 날은 같은 워크플로가 gamepass 만 돌린다
      - name: crawl wikidata
        if: github.event.schedule == '0 5 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: pnpm crawl --source=wikidata --no-match $CRAWL_LIMIT_ARG
