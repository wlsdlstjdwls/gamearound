# 일회성 조사 — Epic 의 Cloudflare 가 Actions 러너 IP 를 막는지 확인한다. 확인 후 삭제한다.
name: probe-epic

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl (브라우저 헤더)
        run: |
          curl -s -o /tmp/out.json -w "curl http=%{http_code}\n" \
            'https://store.epicgames.com/graphql' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' \
            -H 'Accept: */*' -H 'Accept-Language: ko-KR,ko;q=0.9' \
            -H 'Origin: https://store.epicgames.com' -H 'Referer: https://store.epicgames.com/ko/browse' \
            --data '{"query":"query q($country:String!){Catalog{searchStore(country:$country,locale:\"ko\",count:1,category:\"games/edition/base\"){paging{total}}}}","variables":{"country":"KR"}}'
          head -c 200 /tmp/out.json; echo
      - name: node fetch
        run: |
          node -e '
          const H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36","Accept":"*/*","Accept-Language":"ko-KR,ko;q=0.9","Origin":"https://store.epicgames.com","Referer":"https://store.epicgames.com/ko/browse","Content-Type":"application/json"};
          fetch("https://store.epicgames.com/graphql",{method:"POST",headers:H,body:JSON.stringify({query:"query q($country:String!){Catalog{searchStore(country:$country,locale:\"ko\",count:1,category:\"games/edition/base\"){paging{total}}}}",variables:{country:"KR"}})}).then(async r=>console.log("node http="+r.status,(await r.text()).slice(0,150)));
          '
