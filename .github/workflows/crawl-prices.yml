# 설계서 §4.3 — crawl-prices. 소스 순차 실행, 한 소스가 실패해도 다음 소스 계속(continue-on-error).
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락(§4.4)으로 이중 방지.
name: crawl-prices

on:
  schedule:
    # 하루 3회(≈8h 간격): 실행 1회 ~12분 × 3회/일 ≈ 월 1,080분. private 레포 Actions 무료 2,000분 한도 대응.
    # 시각 고정 이유: Steam 할인은 대부분 KST 02:00(UTC 17:00)에 시작, 종료된다. 단순 "0 */8"(KST 01/09/17시)이면
    # 세일 시작 1시간 전에 돌고 다음 실행까지 8시간을 놓치므로, 세일 전환 직후를 첫 타자로 잡는다.
    # UTC 17:10 / 01:10 / 09:10 = KST 02:10 / 10:10 / 18:10.
    - cron: "10 17,1,9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""
      seed_top:
        description: "Steam 신규 시드 개수 (비우면 1500)"
        required: false
        default: ""

concurrency:
  group: crawl-prices
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
  # 한 실행의 총 처리 건수는 BATCH_SIZE.steam(1,500) 이 상한이고 시드가 그 앞자리를 차지한다.
  # 발견은 장르 슬라이스로 수만 건까지 훑을 수 있으므로, 카탈로그는 실행을 거듭하며 며칠에 걸쳐 찬다.
  STEAM_SEED_TOP: ${{ github.event.inputs.seed_top || '1500' }}
  # nintendo 는 요청 간격 4초 × (발견 페이지 + 상품 페이지) 라 BATCH_SIZE.nintendo(120) 안에서 소량만
  NINTENDO_SEED_TOP: '60'
  # epic 은 발견이 카탈로그를 한 바퀴 도는 구조라 카탈로그(KR 기본판 약 7,000건)보다 큰 값을 준다.
  # 한 실행이 처리하는 건수는 BATCH_SIZE.epic(250) 이 막는다 — 며칠에 걸쳐 카탈로그가 찬다.
  EPIC_SEED_TOP: '8000'
  # gog 도 발견이 카탈로그를 한 바퀴 돈다(KR 기준 기본 게임 약 6,400건). 한 실행 처리량은 BATCH_SIZE.gog(400)가 막는다
  GOG_SEED_TOP: '8000'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # --seed-top: Steam 인기순위 상위 N개 중 DB에 없는 appid 를 신규 게임으로 등록한다.
      # 이게 없으면 게임은 최초 `pnpm seed` 로 들어온 것뿐이고 크롤은 기존 게임 가격만 갱신한다(= 게임 수가 늘지 않음).
      # 이미 아는 appid 는 목록 조회(5페이지) 외 추가 요청이 없어 반복 실행 비용은 거의 0.
      - name: crawl steam
        continue-on-error: true
        run: pnpm crawl --source=steam --seed-top=$STEAM_SEED_TOP $CRAWL_LIMIT_ARG

      - name: crawl psstore
        continue-on-error: true
        run: pnpm crawl --source=psstore $CRAWL_LIMIT_ARG

      - name: crawl xbox
        continue-on-error: true
        run: pnpm crawl --source=xbox $CRAWL_LIMIT_ARG

      # Switch 독점작은 Steam 에 없어 nintendo 도 카탈로그를 훑어야 들어온다. 흡수/신규 판단은 제목 역매칭.
      # eShop 은 HTML 크롤(요청 간격 4초)이라 Steam 처럼 대량으로 못 당긴다 — 실행당 소량씩 며칠에 걸쳐 채운다.
      - name: crawl nintendo
        continue-on-error: true
        run: pnpm crawl --source=nintendo --seed-top=$NINTENDO_SEED_TOP $CRAWL_LIMIT_ARG

      # Epic 독점작(Alan Wake 2 등)은 Steam 에 없다. 발견은 공개 GraphQL 한 바퀴, 흡수/신규 판단은 제목 역매칭.
      # 지금은 비활성이라 이 단계가 "건너뜀" 한 줄만 찍고 끝난다 — Cloudflare 가 러너 IP 를 막는다(어댑터 주석).
      # 단계를 남겨 두는 이유: EPIC_CRAWL_ENABLED 를 켜는 순간 워크플로 수정 없이 바로 돌게.
      - name: crawl epic
        continue-on-error: true
        run: pnpm crawl --source=epic --seed-top=$EPIC_SEED_TOP $CRAWL_LIMIT_ARG

      # GOG 는 한국에 달러로 판다 — 가격에 통화가 붙어 들어오고, 원화 가격과 섞어 비교하지 않는다(lib/currency).
      - name: crawl gog
        continue-on-error: true
        run: pnpm crawl --source=gog --seed-top=$GOG_SEED_TOP $CRAWL_LIMIT_ARG
