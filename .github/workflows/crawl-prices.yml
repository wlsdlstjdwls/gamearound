# 설계서 §4.3 — crawl-prices. 소스 순차 실행, 한 소스가 실패해도 다음 소스 계속(continue-on-error).
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락(§4.4)으로 이중 방지.
name: crawl-prices

on:
  schedule:
    # 하루 3회(≈8h 간격): 실행 1회 ~12분 × 3회/일 ≈ 월 1,080분. private 레포 Actions 무료 2,000분 한도 대응.
    # 시각 고정 이유: Steam 할인은 대부분 KST 02:00(UTC 17:00)에 시작·종료된다. 단순 "0 */8"(KST 01/09/17시)이면
    # 세일 시작 1시간 전에 돌고 다음 실행까지 8시간을 놓치므로, 세일 전환 직후를 첫 타자로 잡는다.
    # UTC 17:10 / 01:10 / 09:10 = KST 02:10 / 10:10 / 18:10.
    - cron: "10 17,1,9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""

concurrency:
  group: crawl-prices
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sonjeondeung # 레포 루트는 gamearound/, 앱은 하위 폴더
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: sonjeondeung/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sonjeondeung/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: crawl steam
        continue-on-error: true
        run: pnpm crawl --source=steam $CRAWL_LIMIT_ARG

      - name: crawl psstore
        continue-on-error: true
        run: pnpm crawl --source=psstore $CRAWL_LIMIT_ARG

      - name: crawl xbox
        continue-on-error: true
        run: pnpm crawl --source=xbox $CRAWL_LIMIT_ARG

      - name: crawl nintendo
        continue-on-error: true
        run: pnpm crawl --source=nintendo $CRAWL_LIMIT_ARG
