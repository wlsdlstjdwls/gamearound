# 설계서 §4.3 — crawl-prices. 소스 순차 실행, 한 소스가 실패해도 다음 소스 계속(continue-on-error).
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락(§4.4)으로 이중 방지.
name: crawl-prices

on:
  schedule:
    # 하루 3회(≈8h 간격): 실행 1회 ~10분 × 3회/일 ≈ 월 900분. private 레포 Actions 무료 2,000분 한도 대응.
    # (nintendo, epic 을 Vercel 크론으로 뗀 뒤 1회 실행이 2분쯤 짧아졌다)
    # 시각 고정 이유: Steam 할인은 대부분 KST 02:00(UTC 17:00)에 시작, 종료된다. 단순 "0 */8"(KST 01/09/17시)이면
    # 세일 시작 1시간 전에 돌고 다음 실행까지 8시간을 놓치므로, 세일 전환 직후를 첫 타자로 잡는다.
    # UTC 17:10 / 01:10 / 09:10 = KST 02:10 / 10:10 / 18:10.
    - cron: "10 17,1,9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""
      seed_top:
        description: "Steam 신규 시드 개수 (비우면 1500)"
        required: false
        default: ""

concurrency:
  group: crawl-prices
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
  # --seed-top = 이 실행에서 새로 등록할 상한. 발견은 이미 아는 것을 건너뛰며 카탈로그를 파고든다
  # (server/sync/discover). 실제 몫은 SEED_SHARE_MAX(배치의 절반)가 한 번 더 깎으므로
  # 배치의 절반값을 그대로 적는다 — 나머지 절반은 기존 게임 가격 갱신이 쓴다.
  STEAM_SEED_TOP: ${{ github.event.inputs.seed_top || '750' }}   # BATCH_SIZE.steam 1,500 의 절반
  GOG_SEED_TOP: '200'      # BATCH_SIZE.gog 400 의 절반
  XBOX_SEED_TOP: '100'     # BATCH_SIZE.xbox 200 의 절반
  PSSTORE_SEED_TOP: '100'  # BATCH_SIZE.psstore 200 의 절반

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # --seed-top: 인기순위를 페이지 단위로 훑어 DB 에 없는 appid 를 N개 찾을 때까지 파고든다.
      # 이게 없으면 게임은 최초 `pnpm seed` 로 들어온 것뿐이고 크롤은 기존 게임 가격만 갱신한다(= 게임 수가 늘지 않음).
      # 상위 N개만 보던 예전 방식은 그 N개가 전부 등록된 2026-09-14 에 신규 0건으로 멈춰 있었다.
      - name: crawl steam
        continue-on-error: true
        run: pnpm crawl --source=steam --seed-top=$STEAM_SEED_TOP $CRAWL_LIMIT_ARG

      # PS 독점작도 Steam 에 없다. 발견은 전체 게임 카테고리(콘셉트 단위), 흡수/신규 판단은 제목 역매칭.
      # 질의 해시가 낡으면 "not whitelisted" 로 실패한다 — 갱신 방법은 어댑터 constants 주석에 있다.
      - name: crawl psstore
        continue-on-error: true
        run: pnpm crawl --source=psstore --seed-top=$PSSTORE_SEED_TOP $CRAWL_LIMIT_ARG

      # Xbox 독점작은 Steam 에 없다. 발견은 xbox.com 스토어의 목록(emerald browse), 흡수/신규 판단은 제목 역매칭.
      - name: crawl xbox
        continue-on-error: true
        run: pnpm crawl --source=xbox --seed-top=$XBOX_SEED_TOP $CRAWL_LIMIT_ARG

      # nintendo, epic 은 여기서 돌리지 않는다 — 러너 IP 로는 빈손이고(한국 밖 IP 차단, 데이터센터 IP 차단)
      # 서울 리전 함수에서는 열린다. 두 소스는 Vercel 크론이 맡는다: vercel.json 의 /api/cron/crawl,
      # 몫과 근거는 server/sync/constants 의 CRON_PLAN. 손으로 돌릴 일이 생기면 pnpm crawl:local 이 남아 있다.

      # GOG 는 한국에 달러로 판다 — 가격에 통화가 붙어 들어오고, 원화 가격과 섞어 비교하지 않는다(lib/currency).
      - name: crawl gog
        continue-on-error: true
        run: pnpm crawl --source=gog --seed-top=$GOG_SEED_TOP $CRAWL_LIMIT_ARG
