# 설계서 §4.3 — crawl-prices. 소스 순차 실행, 한 소스가 실패해도 다음 소스 계속(continue-on-error).
# 종료 코드: 0 ok, 2 partial(경고), 1 failed. 중복 실행은 concurrency 그룹 + Redis 락(§4.4)으로 이중 방지.
name: crawl-prices

on:
  schedule:
    # 하루 2회. 횟수를 정한 것은 취향이 아니라 예산이다 — 아래 분 계산을 먼저 읽는다.
    #
    # private 레포의 Actions 무료 한도는 월 2,000분이다. 2026-09-15 실측으로 이 워크플로 1회가
    # 33분이었고(run 34895780383: steam 9.8분, psstore 12.3분, xbox 5.3분, gog 5.7분),
    # 하루 3회면 이 워크플로 하나로 월 3,000분이라 한도의 1.5배였다. 두 가지로 줄였다.
    #   1) 발견(--seed-top)을 여기서 뗐다. 그 시간의 절반에서 77%가 신규 등록이었다
    #      (steam 750/1,497, psstore 150/194, xbox 100/100). 실행 이력으로도 같은 것이 보인다:
    #      발견이 켜지기 전 회차가 12분, 켜진 뒤가 34분이었다(09-13 대 09-14).
    #      발견의 정규 실행처는 이제 Vercel 서울 크론이다 — vercel.json 의 /api/cron/crawl/<source>/discover,
    #      몫과 근거는 sync/constants 의 CRON_PLAN. 백업은 crawl-seed.yml 이 주 1회 돈다.
    #   2) 주기를 3회에서 2회로 내리고, 비싼 두 소스는 그중 1회만 돌린다(아래 cron 주석).
    # 추정: 전체 회차 약 14분 + 가벼운 회차 약 8분 = 월 660분. **추정치다** — 다음 스케줄 실행의
    # 단계별 시간으로 이 숫자를 고친다. 배치 크기나 주기를 올리는 변경은 이 한도를 먼저 확인하고 한다.
    #
    # 시각 고정 이유: Steam 할인은 대부분 KST 02:00(UTC 17:00)에 시작, 종료된다. 단순 "10 */12" 면
    # 세일 시작 직전에 돌고 다음 실행까지 12시간을 놓치므로, 세일 전환 직후를 첫 타자로 잡는다.
    #
    # UTC 17:10 = KST 02:10 — 전 소스
    - cron: "10 17 * * *"
    # UTC 05:10 = KST 14:10 — steam 만. xbox 는 이 회차에서 건너뛴다(단계의 if).
    # 뺀 이유: 건당 요청 1회라 이 워크플로에서 제일 비싼 단계이고,
    # Xbox 할인은 Steam 처럼 하루 안에서 바뀌지 않아 그만큼 자주 볼 값이 아니다.
    # 2026-09-16 에 소스 둘을 껐다 — gog(달러 전용)와 psstore(사용자 지시).
    # 전 소스 회차에서 psstore 12.3분, gog 5.7분이 빠져 한 회차가 약 15분에서 약 9분이 된다.
    - cron: "10 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 소스별 기본값)"
        required: false
        default: ""
      seed_top:
        description: "신규 발견 개수 (비우면 발견 안 함 - 발견의 제자리는 로컬 pnpm crawl:seed)"
        required: false
        default: ""

concurrency:
  group: crawl-prices
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
  # 발견 몫. 스케줄 실행에서는 항상 비어 있다 = 발견을 하지 않고 기존 게임 가격만 갱신한다.
  # 손으로 돌릴 때만 값을 넣어 켠다(로컬 회선이 죽었는데 신규를 급히 넣어야 하는 경우).
  # 소스별 상시 몫은 sync/constants 의 LOCAL_SEED_PLAN 이 갖고 있다.
  CRAWL_SEED_ARG: ${{ github.event.inputs.seed_top != '' && format('--seed-top={0}', github.event.inputs.seed_top) || '' }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    # 발견을 떼며 1회가 33분에서 약 14분으로 줄 것으로 본다. 여유를 두되 60분은 이제 과하다
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: crawl steam
        continue-on-error: true
        run: pnpm crawl --source=steam $CRAWL_SEED_ARG $CRAWL_LIMIT_ARG

      # Xbox 독점작은 Steam 에 없다. 발견은 xbox.com 스토어의 목록(emerald browse), 흡수/신규 판단은 제목 역매칭.
      - name: crawl xbox
        if: github.event.schedule != '10 5 * * *'
        continue-on-error: true
        run: pnpm crawl --source=xbox $CRAWL_SEED_ARG $CRAWL_LIMIT_ARG

      # nintendo, epic 은 여기서 돌리지 않는다 — 러너 IP 로는 빈손이고(한국 밖 IP 차단, 데이터센터 IP 차단)
      # 서울 리전 함수에서는 열린다. 두 소스는 Vercel 크론이 맡는다: vercel.json 의 /api/cron/crawl,
      # 몫과 근거는 server/sync/constants 의 CRON_PLAN. 손으로 돌릴 일이 생기면 pnpm crawl:local 이 남아 있다.

      # GOG 는 2026-09-16 에 껐다 — 한국에 달러로만 팔아 원화 비교에 쓸 값이 없다.
      # 사유 전문은 adapters/index.ts 의 getDisabledReason("gog"). 여기에 단계를 다시 넣지 않는다:
      # crawl CLI 가 비활성 소스를 건너뛰므로 빈손으로 돌며 러너 분만 먹는다.
      #
      # psstore 도 같은 날 껐다가 되살렸는데, **여기로는 돌아오지 않는다** — 정규 실행처가
      # 서울 리전 크론이 됐다(vercel.json 의 /api/cron/crawl/psstore/prices, 하루 4회 × 300건).
      # 이 워크플로 자리는 하루 2회 × 200건이 한계라 한 바퀴가 108일이었다. 근거 전문은
      # server/sync/constants 의 CRON_SOURCES 주석. 두 곳에서 같이 돌리면 Redis 락에 걸려
      # 한쪽이 빈손으로 끝나므로, 단계를 되살리려면 크론을 먼저 뺀다.
