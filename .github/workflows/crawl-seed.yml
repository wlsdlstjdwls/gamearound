# 발견(신규 게임 등록) 백업 회차 — 정규 실행처는 여기가 아니다.
#
# 발견은 2026-09-15 에 Vercel 서울 크론으로 옮겼다(vercel.json 의 /api/cron/crawl/<source>/discover,
# 몫과 근거는 server/sync/constants 의 CRON_PLAN). Actions 분은 계정 전체가 나눠 쓰는 월 2,000분인데
# 발견이 crawl-prices 1회를 12분에서 34분으로 밀어 올리고 있었기 때문이다(실측).
#
# 그런데도 이 워크플로를 남기는 이유는 **출구가 다르기 때문**이다. 크론은 서울 함수 IP(한국)로 나가고
# 러너는 해외 IP 로 나간다. 한쪽이 막히면 다른 쪽이 유일한 경로다 — 쓰이지 않는다고 지우면
# 그때 다시 만들어야 한다(AGENTS §5). 주 1회면 크론이 조용히 죽어도 일주일 안에 드러난다.
#
# 소스별 몫은 sync/constants 의 LOCAL_SEED_PLAN 이 갖고 있다(scripts/crawl-local.ts 가 읽는다).
# 같은 상수를 `pnpm crawl:seed` 가 가정용 회선에서도 쓴다 — 실행처가 셋이어도 몫은 한 곳에서 정한다.
name: crawl-seed

on:
  schedule:
    # 일요일 UTC 20:10 = 월요일 KST 05:10. 주 1회 × 약 35분 ≈ 월 150분.
    # 시각을 고른 기준: 같은 소스를 도는 다른 실행과 겹치지 않게 —
    # 겹치면 Redis 락에 걸려 한쪽이 빈손으로 끝난다(설계서 §4.4).
    #   Vercel 크론 발견  3:10, 4:10, 4:30, 4:50, 15:10, 16:10, 16:30, 16:50 UTC
    #   Actions 가격      5:10, 17:10 UTC (crawl-prices)
    - cron: "10 20 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "배치 크기 덮어쓰기 (비우면 LOCAL_SEED_PLAN 의 소스별 값)"
        required: false
        default: ""

concurrency:
  group: crawl-seed
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
  NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
  VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
  CRAWL_LIMIT_ARG: ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}

jobs:
  seed:
    runs-on: ubuntu-latest
    # 발견이 붙은 회차는 실측 34분이었다(run 34895780383). 여유를 두되 한없이 잡지는 않는다
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@10)를 그대로 사용
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # crawl:seed 는 LOCAL_SEED_SOURCES 를 순서대로 돈다. 한 소스가 실패해도 다음 소스는 계속 간다
      # (crawl-local.ts 가 종료 코드를 모아 준다: 0 전부 ok, 2 일부 partial, 1 하나라도 failed).
      # nintendo, epic 은 여기 없다 — 러너 IP 로는 빈손이라 LOCAL_ONLY_SOURCES 로 갈라 뒀다.
      - name: crawl seed
        run: pnpm crawl:seed $CRAWL_LIMIT_ARG
